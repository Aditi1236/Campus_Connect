services:
  - type: web
    name: campus-connect
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: database
      - key: VITE_API_URL
        value: /api
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
